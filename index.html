<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cartão-Resposta — Simulado</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js" async defer></script>
<style>
  :root{
    /* Base surfaces — a deep graphite console, not pure black */
    --bg:#0D1013;
    --panel:#171A20;
    --panel-2:#1E222B;
    --card:#171A20;
    --line:#282D37;
    --line-soft:#20242C;

    /* Text */
    --ink:#F0EFEA;
    --graphite:#939AA6;

    /* Accent — brass/insignia gold, not terracotta or acid-green */
    --gold:#C9A227;
    --gold-bg:rgba(201,162,39,0.14);
    --gold-ink:#171402;

    /* Semantic status, tuned for a dark surface */
    --green:#48B383;
    --green-bg:rgba(72,179,131,0.14);
    --red:#E36B6F;
    --red-bg:rgba(227,107,111,0.14);
    --brass:#D9A53B;
    --brass-bg:rgba(217,165,59,0.14);

    /* Kept for a couple of inline JS references — now dark-surface values */
    --white:#1B1F27;

    --radius:9px;
    --radius-lg:16px;
    --serif:'Space Grotesk', -apple-system, 'Segoe UI', sans-serif;
    --sans:'Space Grotesk', -apple-system, 'Segoe UI', sans-serif;
    --mono:'IBM Plex Mono', 'SFMono-Regular', Consolas, monospace;
  }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    background-image:
      linear-gradient(rgba(255,255,255,0.028) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.028) 1px, transparent 1px);
    background-size:32px 32px;
    color:var(--graphite);
    font-family:var(--sans);
    min-height:100vh;
    padding:28px 16px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{ max-width:760px; margin:0 auto; }

  /* ---------- Masthead ---------- */
  .masthead{
    display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:18px; margin-bottom:28px;
    flex-wrap:wrap; gap:12px;
  }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand-mark{
    width:38px; height:38px; flex:none; border-radius:10px; background:var(--gold);
    color:var(--gold-ink); font-family:var(--mono); font-weight:700; font-size:0.8rem;
    letter-spacing:-0.02em; display:flex; align-items:center; justify-content:center;
  }
  .masthead h1{
    font-family:var(--serif); font-weight:700; font-size:1.32rem; color:var(--ink); margin:0;
    letter-spacing:-0.01em;
  }
  .masthead .tag{ font-size:0.8rem; color:var(--graphite); margin-top:2px; }
  .stamp-btn{
    font-family:var(--sans); font-size:0.78rem; font-weight:600; color:var(--ink);
    background:var(--panel-2); border:1px solid var(--line); border-radius:7px;
    padding:7px 13px; cursor:pointer; transition:border-color 0.15s ease;
  }
  .stamp-btn:hover{ border-color:var(--gold); }
  .stamp-btn:focus-visible, button:focus-visible, textarea:focus-visible, input:focus-visible, [tabindex]:focus-visible{
    outline:2px solid var(--gold); outline-offset:2px;
  }

  /* ---------- Card shell ---------- */
  .sheet{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.03);
    padding:32px;
  }
  @media (max-width:600px){ .sheet{ padding:20px; } }

  /* ---------- Paste view ---------- */
  .lede{ font-family:var(--serif); font-weight:400; font-size:1.03rem; line-height:1.55; color:var(--ink); margin:0 0 18px; max-width:62ch; }
  textarea{
    width:100%; min-height:520px; resize:vertical;
    font-family:var(--mono); font-size:0.9rem; line-height:1.5;
    padding:16px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--panel-2); color:var(--ink);
  }
  textarea::placeholder{ color:var(--graphite); opacity:0.6; }
  .hint{ font-size:0.82rem; color:var(--graphite); margin-top:8px; line-height:1.5; }
  .row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:20px; }
  .btn-primary{
    font-family:var(--sans); font-weight:600; font-size:0.95rem; color:var(--gold-ink);
    background:var(--gold); border:none; border-radius:8px;
    padding:12px 22px; cursor:pointer; transition:filter 0.15s ease;
  }
  .btn-primary:hover{ filter:brightness(1.1); }
  .btn-primary:disabled{ opacity:0.35; cursor:not-allowed; filter:none; }
  .btn-ghost{
    font-family:var(--sans); font-weight:600; font-size:0.9rem; color:var(--ink);
    background:none; border:1px solid var(--line); border-radius:8px;
    padding:11px 18px; cursor:pointer; transition:border-color 0.15s ease;
  }
  .btn-ghost:hover{ border-color:var(--gold); }
  .error-box{
    margin-top:16px; padding:12px 14px; border-radius:var(--radius);
    background:var(--red-bg); color:#FF9DA1; font-size:0.88rem; border:1px solid rgba(227,107,111,0.35);
  }

  /* ---------- Saved decks ---------- */
  .saved-list{ margin-top:10px; display:flex; flex-direction:column; gap:8px; }
  .saved-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:12px 14px; border:1px solid var(--line); border-radius:var(--radius); background:var(--panel-2);
  }
  .saved-item .meta{ font-size:0.8rem; color:var(--graphite); }
  .saved-item .name{ font-family:var(--serif); font-weight:500; font-size:0.98rem; color:var(--ink); }
  .saved-actions{ display:flex; gap:6px; }
  .link-btn{ background:none; border:none; color:var(--gold); text-decoration:none; cursor:pointer; font-size:0.82rem; padding:4px; font-family:var(--sans); font-weight:600; }
  .link-btn:hover{ text-decoration:underline; }
  .link-btn.danger{ color:var(--red); }

  /* ---------- Review view ---------- */
  .review-item{
    border:1px solid var(--line); border-radius:var(--radius); padding:16px 18px; margin-bottom:10px; background:var(--panel-2);
  }
  .review-item.needs{ border-color:rgba(217,165,59,0.5); background:var(--brass-bg); }
  .review-top{ display:flex; justify-content:space-between; gap:10px; align-items:baseline; }
  .review-num{ font-family:var(--mono); font-weight:600; color:var(--ink); font-size:0.92rem; }
  .review-text{ font-size:0.93rem; margin:8px 0; color:var(--ink); line-height:1.5; }
  .badge{ font-family:var(--sans); font-size:0.74rem; font-weight:600; padding:3px 9px; border-radius:99px; white-space:nowrap; }
  .badge.ok{ background:var(--green-bg); color:var(--green); }
  .badge.missing{ background:var(--brass-bg); color:var(--brass); border:1px solid rgba(217,165,59,0.4); }
  .letter-pick{ display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }
  .letter-pick button{
    width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--panel);
    font-family:var(--mono); font-weight:600; font-size:0.82rem; cursor:pointer; color:var(--ink);
    transition:border-color 0.15s ease;
  }
  .letter-pick button:hover{ border-color:var(--gold); }
  .letter-pick button.chosen{ background:var(--gold); color:var(--gold-ink); border-color:var(--gold); }
  .review-actions{ display:flex; gap:16px; margin-top:10px; }
  .review-actions button{ background:none; border:none; padding:0; cursor:pointer; font-family:var(--sans); font-size:0.8rem; font-weight:600; color:var(--graphite); }
  .review-actions button:hover{ color:var(--ink); }
  .review-actions button.danger{ color:var(--red); }
  .review-actions button.danger:hover{ color:#FF9DA1; }

  .edit-block{ margin-top:10px; }
  .edit-label{ font-family:var(--sans); font-size:0.72rem; font-weight:600; color:var(--graphite); margin:14px 0 5px; }
  .edit-label:first-child{ margin-top:0; }
  .edit-textarea{
    width:100%; min-height:80px; resize:vertical; font-family:var(--sans); font-size:0.92rem; line-height:1.5;
    padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink);
  }
  .edit-alt-row{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .edit-alt-letter{
    width:26px; height:26px; flex:none; border-radius:50%; border:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; justify-content:center; font-family:var(--mono); font-weight:700; font-size:0.76rem; color:var(--ink); cursor:pointer;
    transition:border-color 0.15s ease;
  }
  .edit-alt-letter:hover{ border-color:var(--gold); }
  .edit-alt-letter.chosen{ background:var(--gold); color:var(--gold-ink); border-color:var(--gold); }
  .edit-alt-row input{
    flex:1; font-family:var(--sans); font-size:0.92rem; padding:8px 11px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--ink);
  }
  .edit-alt-remove{
    flex:none; background:none; border:none; color:var(--red); font-size:1.1rem; line-height:1; cursor:pointer; padding:4px 6px;
  }
  .add-alt-btn{
    background:none; border:1px dashed var(--line); border-radius:8px; padding:6px 12px; margin-top:2px;
    font-family:var(--sans); font-size:0.82rem; font-weight:600; color:var(--graphite); cursor:pointer; transition:border-color 0.15s ease, color 0.15s ease;
  }
  .add-alt-btn:hover{ border-color:var(--gold); color:var(--ink); }
  .edit-done-row{ display:flex; justify-content:flex-end; margin-top:12px; }

  /* ---------- Progress bubbles ---------- */
  .progress-row{ display:flex; gap:5px; flex-wrap:wrap; margin-bottom:24px; }
  .prog-dot{
    width:22px; height:22px; border-radius:50%; border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-size:0.66rem; font-weight:600; color:var(--graphite); background:var(--panel-2);
    cursor:pointer;
  }
  .prog-dot.current{ border-color:var(--gold); border-width:2px; }
  .prog-dot.correct{ background:var(--green); border-color:var(--green); color:#0C1712; }
  .prog-dot.wrong{ background:var(--red); border-color:var(--red); color:#1A0B0B; }
  .prog-dot.skip{ background:var(--line); }
  .prog-dot.answered-flag{ background:var(--gold); border-color:var(--gold); color:var(--gold-ink); }

  /* ---------- Quiz card ---------- */
  .q-meta{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px; }
  .q-count{ font-family:var(--mono); font-size:0.8rem; color:var(--graphite); letter-spacing:0.01em; }
  .q-text{ font-family:var(--serif); font-weight:400; font-size:1.16rem; line-height:1.65; color:var(--ink); margin:4px 0 22px; max-width:68ch; }
  .q-text p{ margin:0 0 16px; }
  .q-text p:last-child{ margin-bottom:0; }

  .alt-list{ display:flex; flex-direction:column; gap:10px; }
  .alt{
    display:flex; align-items:flex-start; gap:12px;
    padding:13px 15px; border:1px solid var(--line); border-radius:var(--radius);
    background:var(--panel-2); cursor:pointer; text-align:left; width:100%;
    font-family:var(--sans); font-size:0.96rem; color:var(--ink); transition:border-color 0.15s ease;
  }
  .alt:hover{ border-color:var(--gold); }
  .alt .bubble{
    flex:0 0 28px; width:28px; height:28px; border-radius:50%;
    border:1px solid var(--line); display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:700; font-size:0.85rem; color:var(--ink); background:var(--panel);
  }
  .alt.selected .bubble{ background:var(--gold); color:var(--gold-ink); border-color:var(--gold); }
  .alt.is-correct{ border-color:var(--green); background:var(--green-bg); }
  .alt.is-correct .bubble{ background:var(--green); border-color:var(--green); color:#0C1712; }
  .alt.is-wrong{ border-color:var(--red); background:var(--red-bg); }
  .alt.is-wrong .bubble{ background:var(--red); border-color:var(--red); color:#1A0B0B; }
  .alt:disabled, .alt.locked{ cursor:default; }

  .feedback{ margin-top:16px; font-size:0.92rem; padding:12px 14px; border-radius:var(--radius); }
  .feedback.ok{ background:var(--green-bg); color:var(--green); }
  .feedback.bad{ background:var(--red-bg); color:var(--red); }
  .feedback.none{ background:var(--brass-bg); color:var(--brass); }
  .comment-box{
    margin-top:12px; font-size:0.9rem; line-height:1.55; padding:14px 16px; border-radius:var(--radius);
    background:var(--panel-2); color:var(--ink); border:1px solid var(--line); font-family:var(--sans);
  }
  .comment-box p{ margin:0 0 10px; }
  .comment-box p:last-child{ margin-bottom:0; }
  .comment-label{ font-family:var(--mono); font-size:0.72rem; color:var(--graphite); margin-bottom:6px; }

  .comments-thread{ margin:8px 0 4px; padding:12px 14px; border-radius:10px; background:var(--panel-2); border:1px solid var(--line); }
  .comment-item{ padding:8px 0; border-bottom:1px solid var(--line); }
  .comment-item:last-of-type{ border-bottom:none; }
  .comment-meta{ font-family:var(--mono); font-size:0.7rem; color:var(--graphite); margin-bottom:3px; }
  .comment-text{ font-family:var(--sans); font-size:0.9rem; color:var(--ink); line-height:1.45; }
  .comment-input-row{ margin-top:10px; display:flex; flex-direction:column; gap:6px; align-items:flex-end; }
  .comment-input-row textarea{ width:100%; min-height:50px !important; }

  .quiz-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px; flex-wrap:wrap; }
  .kbd-hint{ font-family:var(--mono); font-size:0.74rem; color:var(--graphite); }

  /* ---------- Result view ---------- */
  .score-hero{ text-align:center; padding:12px 0 26px; border-bottom:1px solid var(--line); margin-bottom:22px; }
  .score-ring{
    --pct:0;
    position:relative; width:164px; height:164px; margin:0 auto 18px; border-radius:50%;
    background:conic-gradient(var(--gold) calc(var(--pct) * 3.6deg), var(--line) 0deg);
  }
  .score-ring::after{
    content:''; position:absolute; inset:11px; border-radius:50%; background:var(--panel);
  }
  .score-ring-num{
    position:relative; z-index:1; width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    font-family:var(--mono); font-weight:600; font-size:1.85rem; color:var(--ink); letter-spacing:-0.02em;
  }
  .score-num{ font-family:var(--mono); font-weight:600; font-size:2.6rem; color:var(--ink); line-height:1; }
  .score-sub{ font-size:0.92rem; color:var(--graphite); margin-top:8px; }
  .result-item{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:11px 14px; border-bottom:1px solid var(--line); font-size:0.88rem;
  }
  .result-item .rtext{ color:var(--ink); max-width:78%; }
  .result-tag{ font-family:var(--mono); font-weight:600; font-size:0.82rem; }
  .result-tag.correct{ color:var(--green); }
  .result-tag.wrong{ color:var(--red); }
  .result-tag.skip{ color:var(--brass); }

  .footer-note{ text-align:center; font-size:0.78rem; color:var(--graphite); opacity:0.7; margin-top:26px; }
  .sr-only{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }

  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,7,9,0.72); z-index:1000;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .modal-box{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:22px; width:100%; max-width:400px; box-shadow:0 20px 60px -20px rgba(0,0,0,0.6);
  }
  .modal-title{ font-family:var(--serif); font-size:1rem; color:var(--ink); line-height:1.45; margin-bottom:14px; white-space:pre-line; }
  .modal-input{
    width:100%; font-family:var(--sans); font-size:0.95rem; padding:10px 12px;
    border:1px solid var(--line); border-radius:8px; background:var(--panel-2); color:var(--ink); margin-bottom:16px;
  }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; }

</style>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div class="brand">
      <div class="brand-mark">CR</div>
      <div>
        <h1>Cartão-Resposta</h1>
        <div class="tag">cole, responda, confira o gabarito</div>
      </div>
    </div>
    <div style="display:flex; gap:8px; align-items:center;">
      <button class="stamp-btn" id="btn-auth">Entrar com Google</button>
      <button class="stamp-btn" id="btn-home" style="display:none;">Início</button>
    </div>
  </div>

  <div class="sheet" id="app"></div>

  <div class="footer-note" id="footnote"></div>
</div>

<div id="modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <div id="modal-title" class="modal-title"></div>
    <input id="modal-input" type="text" class="modal-input" />
    <div class="modal-actions">
      <button id="modal-cancel" class="btn-ghost">Cancelar</button>
      <button id="modal-ok" class="btn-primary">OK</button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";

  /* ============ MODAL (substitui window.prompt/confirm) ============ */
  // O Chrome (e outros navegadores) deixam a pessoa marcar "impedir que
  // esta página crie mais caixas de diálogo" depois de ver alguns
  // prompt()/confirm() seguidos — e a partir daí TODO prompt/confirm nessa
  // aba passa a retornar null/false na hora, sem mostrar nada, fazendo
  // botões parecerem quebrados ("aperto e não acontece nada"). Este modal
  // é HTML normal do próprio site, então não pode ser bloqueado assim.
  function showModal(opts){
    return new Promise(function(resolve){
      var overlay = document.getElementById('modal-overlay');
      var titleEl = document.getElementById('modal-title');
      var input = document.getElementById('modal-input');
      var okBtn = document.getElementById('modal-ok');
      var cancelBtn = document.getElementById('modal-cancel');

      titleEl.textContent = opts.title || '';
      if(opts.withInput){
        input.style.display = 'block';
        input.value = opts.defaultValue || '';
      } else {
        input.style.display = 'none';
      }
      okBtn.textContent = opts.confirmLabel || 'OK';
      cancelBtn.textContent = opts.cancelLabel || 'Cancelar';
      cancelBtn.style.display = opts.hideCancel ? 'none' : 'inline-block';
      overlay.style.display = 'flex';
      if(opts.withInput){ input.focus(); input.select(); }
      else { okBtn.focus(); }

      function cleanup(){
        overlay.style.display = 'none';
        okBtn.onclick = null;
        cancelBtn.onclick = null;
        input.onkeydown = null;
        document.removeEventListener('keydown', onEsc);
      }
      function onEsc(e){ if(e.key === 'Escape'){ cancelBtn.onclick(); } }
      document.addEventListener('keydown', onEsc);

      okBtn.onclick = function(){
        var result = opts.withInput ? (input.value.trim() || null) : true;
        cleanup();
        resolve(result);
      };
      cancelBtn.onclick = function(){
        cleanup();
        resolve(opts.withInput ? null : false);
      };
      input.onkeydown = function(e){ if(e.key === 'Enter'){ okBtn.onclick(); } };
    });
  }
  // Pede um texto curto (substitui window.prompt). Resolve com a string
  // (sem espaços nas pontas) ou null se cancelado / deixado em branco.
  function askText(title, defaultValue){
    return showModal({ title: title, withInput: true, defaultValue: defaultValue, confirmLabel: 'Salvar' });
  }
  // Pede confirmação (substitui window.confirm). Resolve com true/false.
  function askConfirm(message, confirmLabel){
    return showModal({ title: message, withInput: false, confirmLabel: confirmLabel || 'Confirmar' });
  }

  /* ============ CONFIG ============ */
  // Cole aqui o Client ID gerado no Google Cloud Console (Origens JavaScript
  // autorizadas = a URL do seu GitHub Pages, sem barra no final).
   var CONFIG = {
    CLIENT_ID: '1059213534313-6ju5ocufjempla0d8r8n35c7smdnljaf.apps.googleusercontent.com',
    SCOPE: 'https://www.googleapis.com/auth/drive https://www.googleapis.com/auth/userinfo.email https://www.googleapis.com/auth/userinfo.profile',
    // Depois que o arquivo do grupo for criado uma vez, cole o ID aqui para
    // todo mundo usar o mesmo arquivo.
    GROUP_FILE_ID: '1cWFMvuXs5FAaoVjTq0hDESvSEkje8j98',
    // Depois que a primeira sala for criada, o app mostra um ID para você
    // colar aqui — assim todo mundo passa a entrar pelas mesmas salas.
    ROOMS_INDEX_FILE_ID: '1eIpL3yB8E265yocEvZRrzqEKO4cIXMHj',
    // E-mail da conta Google do desenvolvedor (a sua). Só essa conta tem
    // permissão de criar o arquivo do Simulado Diário de cada dia — assim
    // ele sempre fica salvo na SUA conta, nunca na de um usuário qualquer.
    // Preencha com o e-mail exato da conta que você usa para entrar no app.
    DEV_EMAIL: 'victope1234567@gmail.com',
    // Arquivo-índice pequeno que só guarda "qual é o dia de hoje e qual o
    // ID do arquivo de questões de hoje". Criado uma única vez (por você) —
    // depois disso, todo mundo usa esse mesmo índice para achar o arquivo
    // do dia. Cole aqui o ID que o app mostrar na primeira vez que você,
    // logado com o e-mail acima, adicionar uma questão ao Diário.

  // Cada dia tem seu PRÓPRIO arquivo de questões no Drive (ex:
  // "simulado-diario-2026-09-13.json"), criado sempre pela conta do
  // desenvolvedor (CONFIG.DEV_EMAIL) — nunca pela conta de um usuário
  // qualquer. Um arquivo pequeno e fixo, o "índice", só guarda qual é o
  // dia de hoje e o ID do arquivo de hoje; todo mundo lê esse índice pra
  // saber qual arquivo abrir. O dia "vira" às 5h da manhã (ver
  // DAILY_CUTOFF_HOUR); a virada só acontece de fato quando VOCÊ (o
  // desenvolvedor) abrir o app depois desse horário — como é um site
  // estático, sem servidor rodando sozinho de madrugada, é isso que
  // dispara a criação do arquivo novo. O resultado de cada pessoa fica
  // guardado no arquivo PESSOAL dela (não no arquivo do dia), com data,
  // total de questões, nota e o detalhe de quais acertou/errou.
  var dailyIndexFileId = CONFIG.DAILY_INDEX_FILE_ID || null;
  var dailyIndexData = { day: null, fileId: null };
  var dailyFileId = null;
  var dailyData = { day: null, questions: [] };
  var DAILY_CUTOFF_HOUR = 5;

  function pad2(n){ return n < 10 ? '0' + n : '' + n; }

  // Chave do "dia lógico" (ex: "2026-09-12"). Antes das 5h, ainda conta
  // como o dia anterior — é assim que o reset acontece só de madrugada.
  function dailyKeyFor(date){
    var shifted = new Date(date.getTime() - DAILY_CUTOFF_HOUR * 60 * 60 * 1000);
    return shifted.getFullYear() + '-' + pad2(shifted.getMonth() + 1) + '-' + pad2(shifted.getDate());
  }
  function todayDailyKey(){ return dailyKeyFor(new Date()); }
  function formatDayLabel(key){
    var parts = (key || '').split('-');
    return parts.length === 3 ? (parts[2] + '/' + parts[1] + '/' + parts[0]) : (key || '');
  }
  function isDeveloperAccount(){
    return !!CONFIG.DEV_EMAIL && !!userEmail && userEmail.toLowerCase() === CONFIG.DEV_EMAIL.toLowerCase();
  }

  // Dono de um e-mail específico (ou o desenvolvedor, que sempre pode).
  // Se o e-mail não foi registrado (conteúdo antigo, de antes desse
  // controle existir), só o desenvolvedor pode mexer — comportamento mais
  // seguro por padrão.
  function isOwnerEmail(email){
    return isDeveloperAccount() || (!!userEmail && !!email && userEmail.toLowerCase() === email.toLowerCase());
  }

  // Permissão de editar/remover/adicionar questões no simulado ATUALMENTE
  // aberto. Um simulado recém-colado (ainda não salvo em lugar nenhum) pode
  // sempre ser mexido — só quem está vendo a tela consegue vê-lo mesmo. Um
  // simulado PESSOAL também sempre pode: ele já vive só na sua própria
  // conta do Drive, ninguém mais tem como nem abri-lo. Já salvo para o
  // grupo ou numa sala — visíveis para todo mundo — só quem criou ou o
  // desenvolvedor pode mexer. Se não há dono registrado (simulado salvo
  // antes desse controle existir), é tratado como "sem dono" e liberado —
  // a primeira pessoa que editar passa a ser registrada como dono dali pra
  // frente (ver persistDeckQuestions). O Diário usa uma checagem por
  // questão (ver canManageQuestion), já que ali várias pessoas contribuem
  // juntas.
  function canManageDeck(){
    if(!state.deckRef) return true;
    if(state.deckRef.kind === 'daily' || state.deckRef.kind === 'personal') return true;
    if(!state.deckOwnerEmail) return true; // sem dono registrado ainda — liberado, será adotado
    return isOwnerEmail(state.deckOwnerEmail);
  }

  function canManageQuestion(q){
    if(state.deckRef && state.deckRef.kind === 'daily'){
      if(!q.addedByEmail) return true; // sem autor registrado (questão antiga) — liberado
      return isOwnerEmail(q.addedByEmail);
    }
    return canManageDeck();
  }

  // Se o índice ainda aponta pro dia certo, só usa o que já existe. Se o
  // dia virou (ou nunca foi criado), só a conta do desenvolvedor tem
  // permissão de criar o arquivo novo e atualizar o índice — qualquer
  // outra pessoa só espera até o desenvolvedor abrir o app.
  async function ensureTodaysDailyFile(){
    await loadDailyIndex();
    var today = todayDailyKey();

    if(dailyIndexData.day === today && dailyIndexData.fileId){
      dailyFileId = dailyIndexData.fileId;
      try{ dailyData = (await readJsonFile(dailyFileId)) || { day: today, questions: [] }; }
      catch(e){ console.error(e); dailyData = { day: today, questions: [] }; }
      return;
    }

    if(!isDeveloperAccount()){
      // Dia sem arquivo criado ainda, e quem está logado não é o
      // desenvolvedor — não cria nada, só fica "aguardando".
      dailyFileId = null;
      dailyData = { day: today, questions: [] };
      return;
    }

    // A partir daqui, só roda com a conta do desenvolvedor.
    var newId = await createJsonFile('simulado-diario-' + today + '.json', { day: today, questions: [] });
    await shareFileAnyoneWriter(newId);
    dailyFileId = newId;
    dailyData = { day: today, questions: [] };

    if(!dailyIndexFileId){
      dailyIndexFileId = await createJsonFile('simulado-diario-index.json', { day: today, fileId: newId });
      await shareFileAnyoneWriter(dailyIndexFileId);
      // O ID fica disponível no painel "⚙ Configuração" (visível só para
      // você), sem depender de um prompt() que o navegador pode bloquear.
    } else {
      dailyIndexData = { day: today, fileId: newId };
      try{ await writeJsonFile(dailyIndexFileId, dailyIndexData); }
      catch(e){ console.error(e); }
    }
  }

  async function addQuestionsToDaily(newQuestions){
    await ensureTodaysDailyFile();
    if(!dailyFileId){
      alert('O Simulado Diário de hoje ainda não foi criado. Peça para o administrador do site abrir o app primeiro.');
      return false;
    }
    // recarrega antes de anexar, para não perder perguntas que outra pessoa
    // tenha adicionado nesse meio-tempo
    try{ dailyData = (await readJsonFile(dailyFileId)) || dailyData; }catch(e){ /* segue com o que já tem em memória */ }
    var startNumber = dailyData.questions.length;
    var tagged = newQuestions.map(function(q, i){
      return {
        number: startNumber + i + 1,
        text: q.text,
        alternatives: q.alternatives,
        gabarito: q.gabarito,
        gabaritoComentado: q.gabaritoComentado || '',
        addedBy: q.addedBy || authorLabel(),
        addedByEmail: q.addedByEmail || userEmail || '',
        addedAt: q.addedAt || Date.now(),
        qid: q.qid || ('q' + Date.now().toString(36) + i.toString(36) + Math.random().toString(36).slice(2, 7)),
        comments: q.comments || []
      };
    });
    dailyData.questions = dailyData.questions.concat(tagged);
    try{ await writeJsonFile(dailyFileId, dailyData); }
    catch(e){ console.error(e); alert('Não consegui salvar no Simulado Diário agora. Tenta de novo em alguns segundos.'); return false; }
    return true;
  }

  // Lê/grava o histórico pessoal do Simulado Diário no arquivo PESSOAL

  async function saveDailyResult(){
    if(!state.dailyRun) return;
    var day = state.dailyRun.day;
    var correct = 0, wrong = 0;
    var perQuestion = state.questions.map(function(q, i){
      var a = state.answers[i];
      var chosen = (a && !a.skipped) ? a.letter : null;
      var isCorrect = !!(q.gabarito && chosen && chosen === q.gabarito);
      if(q.gabarito && chosen){ if(isCorrect) correct++; else wrong++; }
      return {
        number: q.number,
        text: q.text,
        alternatives: q.alternatives,
        gabarito: q.gabarito,
        gabaritoComentado: q.gabaritoComentado || '',
        chosen: chosen,
        correct: isCorrect
      };
    });
    var entry = {
      day: day,
      finishedAt: Date.now(),
      total: state.questions.length,
      correct: correct,
      wrong: wrong,
      questions: perQuestion
    };
    var history = getDailyHistory().slice();
    var idx = history.findIndex(function(h){ return h.day === day; });
    if(idx >= 0) history[idx] = entry; else history.push(entry);
    history.sort(function(a, b){ return a.day < b.day ? 1 : -1; }); // mais recente primeiro
    await saveKey('dailyHistory', history, false);
  }

  function initGoogleAuth(){
    if(typeof google === 'undefined' || !google.accounts){
      setTimeout(initGoogleAuth, 300);
      return;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({

    });

  function handleTokenResponse(resp){
    if(resp.error){
      alert('Não consegui entrar com o Google: ' + resp.error);
      return;
    }
    accessToken = resp.access_token;
    try{
      var expiresMs = (resp.expires_in ? Number(resp.expires_in) : 3500) * 1000;
      localStorage.setItem('simulado-gauth', JSON.stringify({ token: accessToken, exp: Date.now() + expiresMs }));
    }catch(e){ /* localStorage indisponível, sem problema */ }
    onSignedIn();
  }

  function tryRestoreSession(){
    try{
      var raw = localStorage.getItem('simulado-gauth');
      if(!raw) return false;
      var saved = JSON.parse(raw);
      if(saved && saved.token && saved.exp > Date.now()){
        accessToken = saved.token;
        onSignedIn();
        return true;
      }
      localStorage.removeItem('simulado-gauth');
    }catch(e){ /* ignora e pede login manual */ }
    return false;
  }

  function signIn(){
    if(!tokenClient){ alert('O login do Google ainda está carregando, tenta de novo em 1 segundo.'); return; }
    tokenClient.requestAccessToken();
  }

  function signOut(){
    if(accessToken && google.accounts && google.accounts.oauth2){
      google.accounts.oauth2.revoke(accessToken, function(){});
    }
    try{ localStorage.removeItem('simulado-gauth'); }catch(e){}
    accessToken = null;
    isSignedIn = false;
    userEmail = '';
    userName = '';

  async function driveFetch(url, options){
    options = options || {};
    options.headers = Object.assign({ 'Authorization': 'Bearer ' + accessToken }, options.headers || {});
    var res = await fetch(url, options);
    if(!res.ok){
      var body = await res.text().catch(function(){ return ''; });
      throw new Error('Drive API ' + res.status + ': ' + body.slice(0, 200));
    }
    return res;
  }

  async function findFileByName(name){
    var q = encodeURIComponent("name='" + name + "' and trashed=false");
    var res = await driveFetch('https://www.googleapis.com/drive/v3/files?q=' + q + '&fields=files(id,name)&spaces=drive');
    var data = await res.json();
    return (data.files && data.files[0]) ? data.files[0].id : null;
  }

  async function createJsonFile(name, obj){
    var res = await driveFetch('https://www.googleapis.com/drive/v3/files', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, mimeType: 'application/json' })
    });
    var file = await res.json();
    await writeJsonFile(file.id, obj);
    return file.id;
  }

  async function writeJsonFile(fileId, obj){
    await driveFetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(obj)
    });
  }

  async function readJsonFile(fileId){
    var res = await driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media');
    return await res.json();
  }

  async function shareFileAnyoneWriter(fileId){
    await driveFetch('https://www.googleapis.com/drive/v3/files/' + fileId + '/permissions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ role: 'writer', type: 'anyone' })
    });
  }

  async function loadPersonalFile(){
    var id = await findFileByName('simulado-concurso-pessoal.json');
    if(!id){ id = await createJsonFile('simulado-concurso-pessoal.json', {}); }
    personalFileId = id;
    personalData = (await readJsonFile(id)) || {};
  }

  async function loadGroupFile(){
    if(CONFIG.GROUP_FILE_ID){
      groupFileId = CONFIG.GROUP_FILE_ID;
      groupData = (await readJsonFile(groupFileId)) || {};
    } else {
      groupData = {};
    }
  }

  // Cria o arquivo compartilhado do grupo (uma única vez, feito por você) e
  // já libera edição para "qualquer pessoa com o link".
  async function ensureGroupFile(){
    if(groupFileId) return groupFileId;
    if(!isDeveloperAccount()) return null;
    var id = await createJsonFile('simulado-concurso-grupo.json', {});
    await shareFileAnyoneWriter(id);
    groupFileId = id;
    // O ID fica disponível no painel "⚙ Configuração" (visível só para
    // você), sem depender de um prompt() que o navegador pode bloquear.
    return id;
  }

  async function saveKey(key, value, shared){
    if(!isSignedIn){ memoryStore[memKey(key, shared)] = value; return; }
    try{
      if(shared){
        var gid = await ensureGroupFile();
        if(!gid){
          alert('O arquivo do grupo ainda não foi configurado neste site. Peça para o administrador entrar e salvar algo para o grupo primeiro.');
          return;
        }
        groupData[key] = value;
        await writeJsonFile(gid, groupData);
      } else {
        personalData[key] = value;
        await writeJsonFile(personalFileId, personalData);
      }
    }catch(e){
      console.error(e);
      alert('Não consegui salvar no Google Drive agora. Tenta de novo em alguns segundos.');
    }
  }

  async function loadKey(key, shared){
    if(!isSignedIn){
      var mk = memKey(key, shared);
      return memoryStore.hasOwnProperty(mk) ? memoryStore[mk] : null;
    }
    var store = shared ? groupData : personalData;
    return store.hasOwnProperty(key) ? store[key] : null;
  }

  async function deleteKey(key, shared){
    if(!isSignedIn){ delete memoryStore[memKey(key, shared)]; return; }
    try{
      if(shared){
        delete groupData[key];
        if(groupFileId) await writeJsonFile(groupFileId, groupData);
      } else {
        delete personalData[key];
        if(personalFileId) await writeJsonFile(personalFileId, personalData);
      }
    }catch(e){ console.error(e); }
  }

  /* ============ PARSER ============ */
  // Detects: "a) texto", "(A) texto", "A. texto"  -- single letter a-e only
  var ALT_START = /^\s*\(?([a-eA-E])\)?[\)\.\-:]\s+(.*)$/;
  // Detects a gabarito mention anywhere in a line (handles "✅ Alternativa correta: B", "Gabarito: C", etc.)
  var GAB_ANY = /(?:gabarito|resposta(?:\s*certa|\s*correta)?|alternativa\s*correta)\s*(?:é|eh)?\s*[:\-]?\s*\(?([a-eA-E])\)?/i;
  // Detects the start of an explanation/commentary line that follows a gabarito
  // ("Justificativa: ...", "Comentário: ...", "Explicação: ..."), so that text
  // gets captured as gabaritoComentado instead of discarded.
  var COMMENT_START = /^(?:justificativa|coment[aá]rio(?:\s+do\s+gabarito)?|explica[cç][aã]o)\s*[:\-]?\s*(.*)$/i;

  // Strips Markdown decoration (##/### headings, leading -/*/• bullets, **bold**)
  // so questions copied from ChatGPT/Claude-style Markdown answer sheets
  // ("### **Questão 1**", "* A) texto", "**✅ Gabarito: B**") are recognized
  // the same way as plain-text exam dumps ("1) texto", "a) texto").
  function normalizeLine(line){
    var s = line;
    s = s.replace(/^#{1,6}\s*/, '');   // "### Questão 1" -> "Questão 1"
    s = s.replace(/^[\-*•]\s+/, '');   // "* A) texto" -> "A) texto"
    s = s.replace(/\*\*/g, '');        // "**Gabarito: B**" -> "Gabarito: B"
    return s.trim();
  }

  // Recognizes lines that are page furniture, not real question content:
  // running headers/footers, lone page numbers, horizontal rules ("---"),
  // ALL-CAPS section titles ("GEOGRAFIA DO MARANHÃO"), and short bylines
  // ("Sérgio Henrique"). These commonly sit between questions in text
  // copy-pasted straight from a PDF and would otherwise get glued onto
  // whatever alternative/question was open.
  function isNoiseLine(line){
    if(line === '') return true;
    if(/^[-=_*]{3,}$/.test(line)) return true;
    if(/^\d{1,4}$/.test(line)) return true;
    if(/^\(.+?\)\s*[-–—]\s*\d{1,2}\/\d{1,2}\/\d{2,4}\s*$/.test(line)) return true;
    if(/^simulado\s+especial\b/i.test(line)) return true;
    if(line.length <= 45 && /[A-ZÀ-Ý]/.test(line) && !/[a-zà-ÿ]/.test(line)) return true;
    if(/^[A-ZÀ-Ý][a-zà-ÿ]+(\s[A-ZÀ-Ý][a-zà-ÿ]+){0,2}$/.test(line) && line.length <= 30) return true;
    return false;
  }

  // Recognizes a new question heading in either style:
  //  - "Questão 1", "QUESTÃO 12:", "Questão 3 - texto..." (word + number, text optional on same line)
  //  - "1) texto", "1. texto", "12 - texto" (bare number + delimiter, text same line or optional)
  // expectedNext is the question number we'd expect next (questions found so far + 1).
  // It's only used to accept a bare "1)" with NO text on the same line — guarding
  // against a stray numbered sub-item inside a question body being mistaken for
  // a new question. When text follows the number on the same line, that's a much
  // stronger signal, so it's always accepted regardless of sequence.
  function matchQuestionStart(line, expectedNext){
    var mWord = line.match(/^\s*quest[aã]o\s*n?[ºo°]?\s*(\d{1,3})\s*[:\-\)\.]?\s*(.*)$/i);
    if(mWord) return { text: mWord[2] || "", num: parseInt(mWord[1], 10) };
    var mNum = line.match(/^\s*(\d{1,3})\s*[\)\.\-:–]\s*(.*)$/);
    if(mNum){
      var text = mNum[2] || "";
      if(text.trim().length > 0) return { text: text, num: parseInt(mNum[1], 10) };
      if(parseInt(mNum[1], 10) === expectedNext) return { text: "", num: expectedNext };
    }
    return null;
  }

  // Acha blocos de texto de apoio compartilhados por um intervalo de
  // questões, no padrão comum das provas brasileiras: "TEXTO I — para as
  // questões de 1 a 10", "Texto para responder às questões 21 a 25", etc.
  // Retorna [{from, to, text}], onde `text` é tudo que vem depois do
  // marcador até a primeira questão do intervalo começar.
  function extractPassages(raw){
    var lines = raw.replace(/\r\n/g, '\n').split('\n');
    var markerRe = /texto[^\n]*?quest[oõ]es?\s+(?:de\s+)?(\d{1,3})\s+a\s+(\d{1,3})/i;
    var passages = [];
    for(var i = 0; i < lines.length; i++){
      var m = lines[i].match(markerRe);
      if(!m) continue;
      var from = parseInt(m[1], 10), to = parseInt(m[2], 10);
      if(!(from > 0 && to >= from && to - from < 60)) continue; // sanidade
      var startRe = new RegExp('^\\s*' + from + '\\s*[\\)\\.\\-:]');
      var passageLines = [];
      for(var j = i + 1; j < lines.length; j++){
        if(startRe.test(lines[j].trim())) break;
        if(j - i > 500) break; // limite de segurança
        passageLines.push(lines[j]);
      }
      passages.push({ from: from, to: to, text: passageLines.join('\n').trim() });
    }
    return passages;
  }

  // PDFs de simulado quase sempre têm cabeçalho/rodapé/marca d'água que se
  // repetem em TODA página (nome de quem comprou o curso, site da
  // plataforma, título da prova). Uma linha que aparece 3+ vezes idêntica
  // no documento inteiro quase certamente é isso, não conteúdo de questão
  // — exceto quando a própria linha É algo que o parser precisa reconhecer
  // (início de questão/alternativa/gabarito/comentário), que fica protegido
  // mesmo se repetir bastante (ex: "Gabarito: B" se repete várias vezes ao
  // longo de 100 questões, e isso é normal, não ruído).
  function stripRepeatedNoise(raw){
    var lines = raw.replace(/\r\n/g, '\n').split('\n');
    var freq = {};
    lines.forEach(function(l){
      var t = l.trim();
      if(t) freq[t] = (freq[t] || 0) + 1;
    });
    function isProtected(t){
      return !!matchQuestionStart(t, 1) || ALT_START.test(t) || GAB_ANY.test(t) || COMMENT_START.test(t);
    }
    var kept = lines.filter(function(l){
      var t = l.trim();
      if(!t) return true;
      if(freq[t] >= 3 && !isProtected(t)) return false;
      return true;
    });
    return kept.join('\n');
  }

  /* ============ LEITURA DE PDF (upload direto do simulado) ============ */
  // Usa o pdf.js (carregado via CDN no <head>) para extrair o texto de um
  // PDF direto no navegador — sem precisar de nenhum servidor. Provas em
  // PDF costumam vir em duas colunas (texto de apoio de um lado, questão do
  // outro), então em vez de simplesmente ler os itens de texto na ordem
  // bruta em que o PDF os guarda (o que embaralharia as duas colunas),
  // agrupamos por linha e, quando dá pra perceber que a página tem duas
  // colunas, lemos a coluna esquerda inteira antes da direita.
  async function extractTextFromPdf(file){
    if(typeof pdfjsLib === 'undefined'){
      throw new Error('A biblioteca de leitura de PDF ainda não carregou. Verifique sua internet e tente de novo em alguns segundos.');
    }
    if(!pdfjsLib.GlobalWorkerOptions.workerSrc){
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    var buf = await file.arrayBuffer();
    var pdf = await pdfjsLib.getDocument({ data: buf }).promise;
    var pages = [];
    for(var p = 1; p <= pdf.numPages; p++){
      var page = await pdf.getPage(p);
      var content = await page.getTextContent();
      var viewport = page.getViewport({ scale: 1 });
      pages.push(extractPageText(content.items, viewport.width));
    }
    return pages.join('\n\n');
  }

  function extractPageText(items, pageWidth){
    if(!items.length) return '';
    // agrupa itens de texto em linhas, por proximidade vertical (Y)
    var lines = [];
    items.forEach(function(it){
      var y = Math.round(it.transform[5]);
      var x = it.transform[4];
      var line = lines.filter(function(l){ return Math.abs(l.y - y) < 3; })[0];
      if(!line){ line = { y: y, parts: [] }; lines.push(line); }
      line.parts.push({ x: x, text: it.str });
    });
    lines.forEach(function(l){ l.parts.sort(function(a, b){ return a.x - b.x; }); });

    function lineText(l){
      return l.parts.map(function(p){ return p.text; }).join(' ').replace(/\s+/g, ' ').trim();
    }
    function byYDesc(a, b){ return b.y - a.y; } // Y cresce para cima num PDF

    // tenta perceber se a página tem duas colunas: bastante linha
    // começando bem à esquerda E bastante linha começando bem à direita
    var mid = pageWidth / 2;
    var leftCount = lines.filter(function(l){ return l.parts[0].x < mid; }).length;
    var rightCount = lines.filter(function(l){ return l.parts[0].x >= mid; }).length;
    var isTwoColumn = leftCount > 3 && rightCount > 3;

    if(!isTwoColumn){
      return lines.sort(byYDesc).map(lineText).filter(Boolean).join('\n');
    }
    var left = lines.filter(function(l){ return l.parts[0].x < mid; }).sort(byYDesc);
    var right = lines.filter(function(l){ return l.parts[0].x >= mid; }).sort(byYDesc);
    return left.map(lineText).filter(Boolean).join('\n') + '\n\n' + right.map(lineText).filter(Boolean).join('\n');
  }

  function parseQuestions(raw){
    var lines = raw.replace(/\r\n/g,"\n").split("\n");
    var questions = [];
    var current = null;

    function pushCurrent(){
      if(current && (current.text.trim() || current.alternatives.length)){
        current.text = current.text.trim();
        current.alternatives.forEach(function(a){ a.text = a.text.trim(); });
        current.gabaritoComentado = (current.gabaritoComentado || '').trim();
        questions.push(current);
      }
    }

    lines.forEach(function(rawLine){
      var line = normalizeLine(rawLine.trim());
      if(line === ""){
        // Blank line: if we're still accumulating a question's stem (no
        // alternatives yet, not past the gabarito), treat it as a paragraph
        // break so long reading passages keep their structure instead of
        // collapsing into one dense wall of text. Elsewhere, blank lines
        // are just separators and get ignored as before.
        if(current && !current.locked && current.alternatives.length === 0 && current.text.trim() && !/\n\n$/.test(current.text)){
          current.text += "\n\n";
        }
        return;
      }

      var expectedNext = questions.length + (current ? 2 : 1);
      var qm = matchQuestionStart(line, expectedNext);
      if(qm){
        pushCurrent();
        current = { number: questions.length + 1, originalNumber: qm.num, text: qm.text, alternatives: [], gabarito: null, gabaritoComentado: '', locked: false, commentOpen: false };
        return;
      }

      if(isNoiseLine(line)) return;

      if(!current){
        current = { number: 1, text: "", alternatives: [], gabarito: null, gabaritoComentado: '', locked: false, commentOpen: false };
      }
      if(current.locked){
        // Once the gabarito for this question was found, capture any
        // explanation/justification that follows it as gabaritoComentado,
        // instead of discarding it.
        var cm = line.match(COMMENT_START);
        if(cm){
          current.gabaritoComentado = (current.gabaritoComentado ? current.gabaritoComentado + ' ' : '') + (cm[1] || '').trim();
          current.commentOpen = true;
          return;
        }
        if(current.commentOpen){
          current.gabaritoComentado = (current.gabaritoComentado ? current.gabaritoComentado + ' ' : '') + line;
        }
        return;
      }

      var am = line.match(ALT_START);
      if(am){
        current.alternatives.push({ letter: am[1].toUpperCase(), text: am[2] || "" });
        return;
      }

      var gm = line.match(GAB_ANY);
      if(gm && current.alternatives.length){
        current.gabarito = gm[1].toUpperCase();
        current.locked = true;
        return;
      }

      // continuation line: append to whatever is currently open
      if(current.alternatives.length){
        current.alternatives[current.alternatives.length - 1].text += " " + line;
      } else {
        var endsWithBreak = /\n\n$/.test(current.text);
        current.text += (current.text && !endsWithBreak ? " " : "") + line;
      }
    });
    pushCurrent();

    // Muitas provas trazem um texto de apoio único, compartilhado por várias
    // questões seguidas ("TEXTO I — para as questões de 1 a 10"). Sem isso,
    // cada questão a partir da 2ª perde o contexto do texto, que só ficou
    // colado na questão 1. Aqui a gente acha esses trechos no texto original
    // e cola no início de CADA questão que ele cobre.
    extractPassages(raw).forEach(function(p){
      questions.forEach(function(q){
        var num = (q.originalNumber != null) ? q.originalNumber : q.number;
        if(num >= p.from && num <= p.to && p.text){
          q.text = p.text + (q.text ? '\n\n' + q.text : '');
        }
      });
    });

    // renumber cleanly & drop questions with fewer than 2 alternatives
    var clean = [];
    questions.forEach(function(q){
      if(q.alternatives.length >= 2 && q.text.trim()){
        q.number = clean.length + 1;
        clean.push(q);
      }
    });
    return clean;
  }

  /* ============ STATE ============ */
  var state = {
    view: 'paste',       // paste | review | quiz | result | room
    rawText: '',
    questions: [],
    currentIndex: 0,
    answers: {},          // index -> chosen letter
    submitted: false,      // true only after "Enviar respostas" on the last question
    savedDecks: [],
    room: null,            // { code, fileId, data } quando dentro de uma sala
    roomView: 'subjects',  // subjects | subject-detail
    activeDisciplinaId: null,
    pasteTarget: null,      // { roomCode, disciplinaId } quando colando p/ salvar numa disciplina
    reviewEditIndex: null,  // índice da questão sendo editada na tela de revisão (ou null)
    dailyRun: null,         // { day } quando o simulado atual é o Diário, p/ salvar no histórico ao enviar
    historyEntry: null,     // entrada do histórico do Diário sendo visualizada (tela dailyHistoryDetail)
    deckRef: null,          // { kind: 'daily'|'personal'|'group'|'room', ... } — de onde vieram as questões atuais, p/ salvar alterações/comentários no lugar certo
    deckOwnerEmail: null,   // e-mail de quem criou o simulado atual (deckRef), p/ checar permissão de edição
    openComments: {}        // qid -> true/false, quais threads de comentário estão expandidas
  };

  var app = document.getElementById('app');
  var homeBtn = document.getElementById('btn-home');
  var footnote = document.getElementById('footnote');
  homeBtn.addEventListener('click', function(){ goHome(); });

  function goHome(){
    state.view = 'paste';
    state.rawText = '';
    state.questions = [];
    state.answers = {};
    state.currentIndex = 0;
    state.submitted = false;
    state.room = null;
    state.pasteTarget = null;
    state.reviewEditIndex = null;
    state.dailyRun = null;
    state.historyEntry = null;
    state.deckRef = null;
    state.deckOwnerEmail = null;
    render();
  }

  function el(tag, attrs, children){
    var node = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function(k){
      var v = attrs[k];
      if(v === null || v === undefined || v === false) return; // skip falsy attrs entirely
      if(k === 'class'){ node.className = v; }
      else if(k === 'html'){ node.innerHTML = v; }
      else if(k.indexOf('on') === 0 && typeof v === 'function'){ node.addEventListener(k.slice(2), v); }
      else if(k === 'disabled'){ node.disabled = true; }
      else { node.setAttribute(k, v); }
    });
    (children || []).forEach(function(c){
      if(c === null || c === undefined) return;
      if(typeof c === 'string'){ node.appendChild(document.createTextNode(c)); }
      else { node.appendChild(c); }
    });
    return node;
  }

  /* ============ RENDER ROUTER ============ */
  function render(){
    app.innerHTML = '';
    homeBtn.style.display = state.view === 'paste' ? 'none' : 'inline-block';
    if(state.view === 'paste') renderPaste();
    else if(state.view === 'review') renderReview();
    else if(state.view === 'quiz') renderQuiz();
    else if(state.view === 'result') renderResult();
    else if(state.view === 'room') renderRoom();
    else if(state.view === 'dailyHistoryDetail') renderDailyHistoryDetail();
    updateFootnote();
  }

  function updateFootnote(){
    if(state.view === 'quiz'){
      footnote.textContent = 'Atalhos: teclas A–E para responder, Enter para avançar';
    } else {
      footnote.textContent = '';
    }
  }

  /* ============ PASTE VIEW ============ */
  function renderPaste(){
    if(state.pasteTarget && state.pasteTarget.type === 'room' && state.room){
      var disc = state.room.data.disciplinas.find(function(d){ return d.id === state.pasteTarget.disciplinaId; });
      var banner = el('div', { class: 'feedback none' }, [
        'Adicionando simulado para a disciplina "' + (disc ? disc.name : '') + '" na sala "' + state.room.data.name + '". '
      ]);
      var cancelLink = el('button', { class: 'link-btn' }, ['Cancelar e voltar para a disciplina']);
      cancelLink.addEventListener('click', function(){
        state.pasteTarget = null;
        state.view = 'room';
        state.roomView = 'subject-detail';
        render();
      });
      banner.appendChild(cancelLink);
      app.appendChild(banner);
    } else if(state.pasteTarget && state.pasteTarget.type === 'daily'){
      var dailyBanner = el('div', { class: 'feedback none' }, [
        'Adicionando questão(ões) ao Simulado Diário — vai ficar disponível para todo mundo do site. '
      ]);
      var cancelLink2 = el('button', { class: 'link-btn' }, ['Cancelar']);
      cancelLink2.addEventListener('click', function(){
        state.pasteTarget = null;
        render();
      });
      dailyBanner.appendChild(cancelLink2);
      app.appendChild(dailyBanner);
    } else if(state.pasteTarget && state.pasteTarget.type === 'append'){
      var appendBanner = el('div', { class: 'feedback none' }, [
        'Adicionando questões a este simulado — as ' + state.questions.length + ' que já estavam aqui continuam. '
      ]);
      var cancelLink3 = el('button', { class: 'link-btn' }, ['Cancelar e voltar']);
      cancelLink3.addEventListener('click', function(){
        state.pasteTarget = null;
        state.view = 'review';
        render();
      });
      appendBanner.appendChild(cancelLink3);
      app.appendChild(appendBanner);
    }

    var lede = el('p', { class: 'lede' }, [
      'Cole abaixo as questões que você recebeu da IA — pode ser 10, 30 ou 100 de uma vez. ' +
      'O site separa cada questão e suas alternativas automaticamente, e detecta o gabarito quando ele já vem junto.'
    ]);

    var textarea = el('textarea', {
      placeholder: '1) Qual é a capital do Brasil?\na) São Paulo\nb) Rio de Janeiro\nc) Brasília\nd) Belo Horizonte\nGabarito: C\n\n2) ...'
    });
    textarea.value = state.rawText;

    var pdfInput = document.createElement('input');
    pdfInput.type = 'file';
    pdfInput.accept = 'application/pdf';
    pdfInput.style.display = 'none';
    var pdfBtn = el('button', { class: 'btn-ghost' }, ['📄 Enviar PDF do simulado']);
    var pdfStatus = el('span', { class: 'hint', style: 'margin-left:10px;' }, ['']);
    pdfBtn.addEventListener('click', function(){ pdfInput.click(); });
    pdfInput.addEventListener('change', async function(){
      var file = pdfInput.files[0];
      if(!file) return;
      pdfBtn.disabled = true;
      pdfBtn.textContent = 'Lendo PDF…';
      pdfStatus.textContent = 'Isso pode levar alguns segundos num PDF grande.';
      try{
        var text = await extractTextFromPdf(file);
        textarea.value = text;
        state.rawText = text;
        pdfStatus.textContent = 'PDF lido! Dá uma conferida no texto abaixo e clica em "Formatar questões".';
      }catch(e){
        console.error(e);
        pdfStatus.textContent = '';
        alert('Não consegui ler esse PDF: ' + (e.message || 'erro desconhecido') + '. Você ainda pode copiar e colar o texto manualmente.');
      }
      pdfBtn.disabled = false;
      pdfBtn.textContent = '📄 Enviar PDF do simulado';
      pdfInput.value = '';
    });
    var pdfRow = el('div', { class: 'row', style: 'margin-top:0; margin-bottom:16px;' }, [pdfBtn, pdfInput, pdfStatus]);

    var hint = el('p', { class: 'hint' },
      ['Funciona com questões numeradas (1. ou 1)) e alternativas de A a E (a), A), A.) — inclusive coladas em Markdown (### Questão 1, * A) texto, **Gabarito: B**) ou extraídas de um PDF. Se uma questão não tiver o gabarito indicado, você marca a resposta certa na próxima tela, antes de começar.']);

    var errorBox = null;

    var startBtn = el('button', { class: 'btn-primary' }, ['Formatar questões']);
    startBtn.addEventListener('click', function(){
      var raw = textarea.value;
      var parsed = parseQuestions(stripRepeatedNoise(raw));
      if(parsed.length === 0){
        if(errorBox) errorBox.remove();
        errorBox = el('div', { class: 'error-box' }, [
          'Não consegui identificar nenhuma questão nesse texto. Confirme se as questões estão numeradas (ex: "1)") e as alternativas com letras (ex: "a)"), cada item em sua própria linha.'
        ]);
        app.querySelector('.row').insertAdjacentElement('afterend', errorBox);
        return;
      }
      var stamp = authorLabel();
      var stampEmail = userEmail || '';
      var stampedAt = Date.now();
      parsed.forEach(function(q, i){
        q.addedBy = stamp;
        q.addedByEmail = stampEmail;
        q.addedAt = stampedAt;
        q.qid = 'q' + stampedAt.toString(36) + i.toString(36) + Math.random().toString(36).slice(2, 7);
        q.comments = [];
      });

      if(state.pasteTarget && state.pasteTarget.type === 'append'){
        state.questions = state.questions.concat(parsed);
        state.questions.forEach(function(q, i){ q.number = i + 1; });
        state.pasteTarget = null;
        state.rawText = '';
        state.view = 'review';
        render();
        persistDeckQuestions().catch(function(e){ console.error(e); });
        return;
      }

      state.rawText = raw;
      state.questions = parsed;
      state.dailyRun = null;
      state.deckRef = null;
      state.deckOwnerEmail = null;
      state.answers = {};
      state.currentIndex = 0;
      state.view = 'review';
      render();
    });

    var row = el('div', { class: 'row' }, [startBtn]);

    app.appendChild(lede);
    app.appendChild(pdfRow);
    app.appendChild(textarea);
    app.appendChild(hint);
    app.appendChild(row);

    // simulado diário (banco global, só quando logado)
    renderDailySectionInto(app);

    // salas de estudo (só quando logado)
    renderRoomsSectionInto(app);

    // saved decks section
    renderSavedDecksInto(app);

    // painel de diagnóstico — só aparece pra você (CONFIG.DEV_EMAIL)
    renderDevConfigPanelInto(app);

    // lembrete visível pra qualquer um enquanto DEV_EMAIL não for configurado,
    // já que enquanto isso ninguém (nem você) tem acesso de desenvolvedor
    if(!CONFIG.DEV_EMAIL && isSignedIn){
      app.appendChild(el('div', { class: 'hint', style: 'margin-top:18px; border-top:1px solid var(--line-soft); padding-top:14px;' }, [
        '⚠ CONFIG.DEV_EMAIL ainda não foi preenchido no código. Enquanto isso, ninguém tem acesso de administrador — cole o e-mail da conta do desenvolvedor lá para liberar isso.'
      ]));
    }
  }

  // Mostra, só para o desenvolvedor, os IDs que o app já resolveu em
  // memória para os arquivos compartilhados. Isso existe porque
  // ROOMS_INDEX_FILE_ID e DAILY_INDEX_FILE_ID em CONFIG começam vazios: o
  // app acha o arquivo certo automaticamente na SUA conta (que foi quem
  // criou), mas outras pessoas não têm como achar esse mesmo arquivo
  // sozinhas — cada conta só enxerga os próprios arquivos numa busca por
  // nome. Enquanto o ID não estiver fixo em CONFIG, só você consegue usar
  // Salas/Diário; qualquer outra pessoa recebe "código não encontrado" ou
  // "ainda não foi criado" mesmo com tudo certo, porque a sessão dela
  // nunca encontra o arquivo. Copiar esses IDs para CONFIG resolve isso de vez.
  function renderDevConfigPanelInto(container){
    if(!isDeveloperAccount()) return;
    var section = el('div', { style: 'margin-top:30px; border-top:1px solid var(--line-soft); padding-top:18px;' });
    section.appendChild(el('div', { style: 'font-family:var(--serif); font-weight:600; color:var(--ink); margin-bottom:8px;' }, ['⚙ Configuração (só você vê isso)']));
    section.appendChild(el('div', { class: 'hint', style: 'margin-bottom:12px;' }, [
      'Cole os IDs abaixo em CONFIG no código, no topo do arquivo. Enquanto ROOMS_INDEX_FILE_ID e DAILY_INDEX_FILE_ID estiverem vazios, só a sua conta consegue achar essas salas/o Diário — qualquer outra pessoa recebe erro de "não encontrado" mesmo com o código certo.'
    ]));

    var rows = [
      { label: 'ROOMS_INDEX_FILE_ID', value: roomsIndexFileId, ok: !!CONFIG.ROOMS_INDEX_FILE_ID },
      { label: 'DAILY_INDEX_FILE_ID', value: dailyIndexFileId, ok: !!CONFIG.DAILY_INDEX_FILE_ID },
      { label: 'GROUP_FILE_ID', value: CONFIG.GROUP_FILE_ID || groupFileId, ok: !!CONFIG.GROUP_FILE_ID }
    ];
    rows.forEach(function(r){
      var row = el('div', { class: 'saved-item' }, [
        el('div', {}, [
          el('div', { class: 'name' }, [r.label]),
          el('div', { class: 'meta' }, [
            r.ok
              ? 'já fixado em CONFIG ✓'
              : (r.value ? r.value : 'ainda não existe — crie uma sala ou adicione uma questão ao Diário primeiro')
          ])
        ])
      ]);
      if(!r.ok && r.value){
        var copyBtn = el('button', { class: 'link-btn', onclick: function(){
          if(navigator.clipboard){ navigator.clipboard.writeText(r.value); }
          alert(r.label + ':\n' + r.value + '\n\n(copiado — cole em CONFIG no código)');
        } }, ['Copiar']);
        row.appendChild(el('div', { class: 'saved-actions' }, [copyBtn]));
      }
      section.appendChild(row);
    });

    container.appendChild(section);
  }

    var room = state.room;
    var isOwner = !!userEmail && room.data.ownerEmail === userEmail;

    app.appendChild(el('div', { class: 'lede' }, [room.data.name]));
    app.appendChild(el('div', { class: 'hint', style: 'margin-bottom:18px;' }, [
      'Código para convidar o grupo: ' + room.code + (isOwner ? ' (você criou esta sala)' : '')

      item.appendChild(el('div', { class: 'review-top' }, [
        el('span', { class: 'review-num' }, [disc.name]),

      ]));

          var ok = await askConfirm('Excluir "' + disc.name + '" e todos os simulados dela? Essa ação não pode ser desfeita.', 'Excluir');
