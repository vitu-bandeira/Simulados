  /* ============ REVIEW VIEW ============ */
  function findQuestionIndexFor(list, q){
    var idx = list.findIndex(function(x){ return q.qid && x.qid === q.qid; });
    if(idx >= 0) return idx;
    return list.findIndex(function(x){ return x.text === q.text; });
  }

  // Grava q.comments de volta no arquivo do Drive de onde essas questões
  // vieram (Diário, um simulado salvo — pessoal ou do grupo —, ou o deck
  // de uma disciplina de sala). Se as questões ainda não foram salvas em
  // lugar nenhum (texto recém-colado), o comentário só existe localmente
  // nesta sessão — não tem onde persistir ainda.
  async function persistQuestionComments(q){
    var ref = state.deckRef;
    if(!ref) return;
    try{
      if(ref.kind === 'daily'){
        if(!dailyFileId) return;
        var fresh = (await readJsonFile(dailyFileId)) || dailyData;
        var idx = findQuestionIndexFor(fresh.questions, q);
        if(idx >= 0){
          fresh.questions[idx].qid = q.qid;
          fresh.questions[idx].comments = q.comments;
          await writeJsonFile(dailyFileId, fresh);
          dailyData = fresh;
        }
      } else if(ref.kind === 'personal' || ref.kind === 'group'){
        var shared = ref.kind === 'group';
        var data = await loadKey('deck-' + ref.id, shared);
        if(data && data.questions){
          var idx2 = findQuestionIndexFor(data.questions, q);
          if(idx2 >= 0){
            data.questions[idx2].qid = q.qid;
            data.questions[idx2].comments = q.comments;
            await saveKey('deck-' + ref.id, data, shared);
          }
        }
      } else if(ref.kind === 'room' && state.room){
        try{ state.room.data = (await readJsonFile(state.room.fileId)) || state.room.data; }catch(e){ /* segue com o que já tem em memória */ }
        var disc = state.room.data.disciplinas.find(function(d){ return d.id === ref.disciplinaId; });
        var deck = disc && disc.decks.find(function(d){ return d.id === ref.deckId; });
        if(deck && deck.questions){
          var idx3 = findQuestionIndexFor(deck.questions, q);
          if(idx3 >= 0){
            deck.questions[idx3].qid = q.qid;
            deck.questions[idx3].comments = q.comments;
            await persistRoom();
          }
        }
      }
    }catch(e){ console.error(e); }
  }

  // Grava o array atual de questões (depois de editar, adicionar ou remover
  // alguma) de volta no arquivo de origem. Para simulados pessoais/do
  // grupo/de sala, só acontece se a pessoa puder mexer no simulado inteiro
  // (canManageDeck). Para o Diário — que é colaborativo — cada questão só é
  // sobrescrita/removida se a pessoa tinha permissão sobre ELA
  // especificamente (canManageQuestion); questões de outras pessoas que
  // ainda existem no arquivo remoto são preservadas mesmo que não estejam
  // mais na lista local por algum motivo.
  async function persistDeckQuestions(){
    var ref = state.deckRef;
    if(!ref) return;
    try{
      if(ref.kind === 'daily'){
        if(!dailyFileId) return;
        var fresh = (await readJsonFile(dailyFileId)) || dailyData;
        var localIds = state.questions.map(function(q){ return q.qid; });
        // aplica edições feitas em questões que a pessoa tinha permissão de mexer
        state.questions.forEach(function(q){
          if(!canManageQuestion(q)) return;
          if(!q.addedByEmail){ q.addedByEmail = userEmail || ''; q.addedBy = q.addedBy || authorLabel(); } // adota questão sem autor registrado
          var idx = findQuestionIndexFor(fresh.questions, q);
          if(idx >= 0){
            fresh.questions[idx] = Object.assign({}, fresh.questions[idx], {
              text: q.text, alternatives: q.alternatives, gabarito: q.gabarito,
              gabaritoComentado: q.gabaritoComentado, qid: q.qid,
              addedByEmail: q.addedByEmail, addedBy: q.addedBy
            });
          } else {
            fresh.questions.push(q);
          }
        });
        // remove do arquivo remoto as questões que sumiram da lista local,
        // mas só as que a pessoa tinha permissão de remover
        fresh.questions = fresh.questions.filter(function(x){
          return localIds.indexOf(x.qid) >= 0 || !canManageQuestion(x);
        });
        fresh.questions.forEach(function(q, i){ q.number = i + 1; });
        await writeJsonFile(dailyFileId, fresh);
        dailyData = fresh;
      } else if(ref.kind === 'personal' || ref.kind === 'group'){
        if(!canManageDeck()) return;
        var shared = ref.kind === 'group';
        var data = await loadKey('deck-' + ref.id, shared);
        if(data){
          data.questions = state.questions;
          if(shared && !data.createdByEmail){ data.createdByEmail = userEmail || ''; } // adota deck sem dono registrado
          await saveKey('deck-' + ref.id, data, shared);
        }
        var idxList = await loadKey('decks-index', shared) || [];
        var idxItem = idxList.find(function(d){ return d.id === ref.id; });
        if(idxItem){
          idxItem.count = state.questions.length;
          if(shared && !idxItem.createdByEmail){ idxItem.createdByEmail = userEmail || ''; idxItem.createdBy = idxItem.createdBy || authorLabel(); }
          await saveKey('decks-index', idxList, shared);
        }
        if(shared) state.deckOwnerEmail = state.deckOwnerEmail || userEmail || null;
      } else if(ref.kind === 'room' && state.room){
        if(!canManageDeck()) return;
        try{ state.room.data = (await readJsonFile(state.room.fileId)) || state.room.data; }catch(e){ /* segue com o que já tem em memória */ }
        var disc = state.room.data.disciplinas.find(function(d){ return d.id === ref.disciplinaId; });
        var deck = disc && disc.decks.find(function(d){ return d.id === ref.deckId; });
        if(deck){
          deck.questions = state.questions;
          deck.count = state.questions.length;
          if(!deck.createdByEmail){ deck.createdByEmail = userEmail || ''; deck.createdBy = deck.createdBy || authorLabel(); } // adota deck sem dono registrado
          await persistRoom();
          state.deckOwnerEmail = state.deckOwnerEmail || userEmail || null;
        }
      }
    }catch(e){
      console.error(e);
      alert('Não consegui salvar as alterações agora. Tenta de novo em alguns segundos.');
    }
  }

  function formatDateTime(ts){
    var d = new Date(ts);
    return d.toLocaleDateString('pt-BR') + ' ' + d.toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
  }

  // Botão + thread de comentários sobre o gabarito de uma questão. Pode ser
  // usado tanto na tela de revisão quanto na tela do simulado (depois de
  // responder). Todo mundo que tiver acesso àquele simulado pode ler e
  // escrever — os comentários ficam salvos junto da questão.
  function renderCommentsToggle(q){
    if(!q.qid){ q.qid = 'q' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
    var wrap = el('div', { style: 'margin-top:4px;' });
    var count = (q.comments || []).length;
    var isOpen = !!state.openComments[q.qid];
    var toggleBtn = el('button', { class: 'link-btn' }, [
      '💬 ' + (count ? count + (count === 1 ? ' comentário' : ' comentários') : 'Comentar sobre o gabarito')
    ]);
    toggleBtn.addEventListener('click', function(){
      state.openComments[q.qid] = !isOpen;
      render();
    });
    wrap.appendChild(toggleBtn);
    if(isOpen) wrap.appendChild(renderCommentsThread(q));
    return wrap;
  }

  function renderCommentsThread(q){
    var box = el('div', { class: 'comments-thread' });
    (q.comments || []).forEach(function(c){
      box.appendChild(el('div', { class: 'comment-item' }, [
        el('div', { class: 'comment-meta' }, [c.author + ' · ' + formatDateTime(c.at)]),
        el('div', { class: 'comment-text' }, [c.text])
      ]));
    });
    if((q.comments || []).length === 0){
      box.appendChild(el('div', { class: 'hint', style: 'margin-bottom:8px;' }, ['Nenhum comentário ainda — seja o primeiro a comentar sobre o gabarito.']));
    }
    var inputRow = el('div', { class: 'comment-input-row' });
    var input = el('textarea', { class: 'edit-textarea', placeholder: 'Escreva um comentário sobre o gabarito desta questão...', style: 'min-height:50px;' });
    var sendBtn = el('button', { class: 'btn-ghost' }, ['Comentar']);
    sendBtn.addEventListener('click', function(){
      var text = input.value.trim();
      if(!text) return;
      q.comments = q.comments || [];
      q.comments.push({ author: authorLabel(), text: text, at: Date.now() });
      sendBtn.disabled = true;
      persistQuestionComments(q).catch(function(e){ console.error(e); }).then(function(){ render(); });
      render();
    });
    inputRow.appendChild(input);
    inputRow.appendChild(sendBtn);
    box.appendChild(inputRow);
    return box;
  }

  function relabelAlternatives(q){
    // Recomputes A/B/C/... letters from the alternatives' current order,
    // keeping the gabarito pointed at the same alternative it was before
    // (even if its letter shifted because one above it was removed).
    var gabAlt = q.alternatives.find(function(a){ return a.letter === q.gabarito; });
    q.alternatives.forEach(function(a, idx){ a.letter = String.fromCharCode(65 + idx); });
    q.gabarito = gabAlt ? gabAlt.letter : null;
  }

  function renderReview(){
    var missing = state.questions.filter(function(q){ return !q.gabarito; }).length;

    var head = el('div', { class: 'lede' }, [
      state.questions.length + ' questões identificadas' +
      (missing ? '. ' + missing + ' sem gabarito indicado — marque a resposta certa antes de começar (opcional).' : '. Todas com gabarito detectado.')
    ]);
    app.appendChild(head);

    var list = el('div', {});
    state.questions.forEach(function(q, i){
      var editing = state.reviewEditIndex === i;
      var hasGab = !!q.gabarito;
      var item = el('div', { class: 'review-item' + (hasGab ? '' : ' needs') });
      var top = el('div', { class: 'review-top' }, [
        el('span', { class: 'review-num' }, ['Questão ' + q.number]),
        hasGab
          ? el('span', { class: 'badge ok' }, ['Gabarito detectado'])
          : el('span', { class: 'badge missing' }, ['sem gabarito'])
      ]);
      item.appendChild(top);

      if(editing){
        item.appendChild(renderQuestionEditor(q, i));
      } else {
        item.appendChild(el('div', { class: 'review-text' }, [truncate(q.text, 140)]));
        if(q.addedBy){
          item.appendChild(el('div', { class: 'hint', style: 'margin:-4px 0 8px;' }, ['Adicionado por ' + q.addedBy]));
        }
        if(q.gabaritoComentado){
          item.appendChild(el('div', { class: 'hint', style: 'margin:-4px 0 8px;' }, ['💬 Tem gabarito comentado']));
        }

        if(!hasGab){
          var picker = el('div', { class: 'letter-pick' });
          q.alternatives.forEach(function(a){
            var b = el('button', {
              onclick: function(){
                q.gabarito = a.letter;
                render();
              }
            }, [a.letter]);
            picker.appendChild(b);
          });
          item.appendChild(picker);
        }

        if(canManageQuestion(q)){
          var actions = el('div', { class: 'review-actions' });
          var editLink = el('button', {
            onclick: function(){ state.reviewEditIndex = i; render(); }
          }, ['Editar questão']);
          var removeLink = el('button', {
            class: 'danger',
            onclick: async function(){
              var ok = await askConfirm('Remover a Questão ' + q.number + '?', 'Remover');
              if(!ok) return;
              state.questions.splice(i, 1);
              state.questions.forEach(function(qq, idx){ qq.number = idx + 1; });
              render();
              persistDeckQuestions().catch(function(e){ console.error(e); });
            }
          }, ['Remover questão']);
          actions.appendChild(editLink);
          actions.appendChild(removeLink);
          item.appendChild(actions);
        }
        item.appendChild(renderCommentsToggle(q));
      }

      list.appendChild(item);
    });
    app.appendChild(list);

    var startBtn = el('button', { class: 'btn-primary' }, ['Iniciar simulado']);
    startBtn.addEventListener('click', function(){
      state.view = 'quiz';
      state.currentIndex = 0;
      state.answers = {};
      state.submitted = false;
      render();
    });
    var saveBtn = el('button', { class: 'btn-ghost' }, ['Salvar (só eu)']);
    saveBtn.addEventListener('click', function(){ saveCurrentDeck(false); });
    var saveGroupBtn = el('button', { class: 'btn-ghost' }, ['Salvar para o grupo']);
    saveGroupBtn.addEventListener('click', function(){ saveCurrentDeck(true); });

    var buttons = [startBtn];
    if(!state.deckRef){
      // Simulado recém-colado, ainda não salvo em lugar nenhum — dá pra
      // voltar e mexer no texto original livremente.
      var editBtn = el('button', { class: 'btn-ghost' }, ['Editar texto']);
      editBtn.addEventListener('click', function(){ state.view = 'paste'; render(); });
      buttons.push(editBtn);
    } else if(state.deckRef.kind !== 'daily' && canManageDeck()){
      // Simulado já salvo (pessoal/grupo/sala) — só quem criou (ou o
      // desenvolvedor) pode somar mais questões a ele.
      var addMoreBtn = el('button', { class: 'btn-ghost' }, ['+ Adicionar mais questões']);
      addMoreBtn.addEventListener('click', function(){
        state.pasteTarget = { type: 'append' };
        state.rawText = '';
        state.view = 'paste';
        render();
      });
      buttons.push(addMoreBtn);
    }
    buttons.push(saveBtn, saveGroupBtn);
    if(state.pasteTarget && state.pasteTarget.type === 'room' && state.room){
      var saveRoomBtn = el('button', { class: 'btn-primary' }, ['Salvar nesta disciplina']);
      saveRoomBtn.addEventListener('click', saveDeckToRoom);
      buttons.push(saveRoomBtn);
    } else if(state.pasteTarget && state.pasteTarget.type === 'daily'){
      var saveDailyBtn = el('button', { class: 'btn-primary' }, ['Adicionar ao Simulado Diário']);
      saveDailyBtn.addEventListener('click', async function(){
        var ok = await addQuestionsToDaily(state.questions);
        if(ok){
          alert('Questões adicionadas ao Simulado Diário!');
          state.pasteTarget = null;
          state.view = 'paste';
          render();
        }
      });
      buttons.push(saveDailyBtn);
    }

    app.appendChild(el('div', { class: 'row' }, buttons));
  }

  // Builds the inline editor shown inside a review card when the person
  // clicks "Editar questão". Edits apply live to the question object as
  // they're typed; there's no separate save step, just a "Concluído" button
  // that closes the editor. Also supports adding/removing alternatives and
  // re-picking the gabarito.
  function renderQuestionEditor(q, i){
    var wrap = el('div', { class: 'edit-block' });

    wrap.appendChild(el('div', { class: 'edit-label' }, ['Enunciado']));
    var textArea = el('textarea', { class: 'edit-textarea' });
    textArea.value = q.text;
    textArea.addEventListener('input', function(){ q.text = textArea.value; });
    wrap.appendChild(textArea);

    wrap.appendChild(el('div', { class: 'edit-label' }, ['Alternativas — clique na letra para marcar como gabarito']));
    var altList = el('div', {});
    q.alternatives.forEach(function(a, altIdx){
      var row = el('div', { class: 'edit-alt-row' });
      var letterBtn = el('button', {
        class: 'edit-alt-letter' + (q.gabarito === a.letter ? ' chosen' : ''),
        title: 'Marcar ' + a.letter + ' como gabarito',
        onclick: function(){ q.gabarito = a.letter; render(); }
      }, [a.letter]);
      var input = el('input', { type: 'text', value: a.text });
      input.addEventListener('input', function(){ a.text = input.value; });
      var removeBtn = el('button', {
        class: 'edit-alt-remove',
        title: 'Remover esta alternativa',
        onclick: function(){
          if(q.alternatives.length <= 2){ alert('A questão precisa de pelo menos 2 alternativas.'); return; }
          q.alternatives.splice(altIdx, 1);
          relabelAlternatives(q);
          render();
        }
      }, ['×']);
      row.appendChild(letterBtn);
      row.appendChild(input);
      row.appendChild(removeBtn);
      altList.appendChild(row);
    });
    wrap.appendChild(altList);

    var addBtn = el('button', {
      class: 'add-alt-btn',
      onclick: function(){
        q.alternatives.push({ letter: '?', text: '' });
        relabelAlternatives(q);
        render();
      }
    }, ['+ adicionar alternativa']);
    wrap.appendChild(addBtn);

    wrap.appendChild(el('div', { class: 'edit-label' }, ['Gabarito comentado (opcional) — explicação de por que a resposta está certa']));
    var commentArea = el('textarea', { class: 'edit-textarea', style: 'min-height:60px;' });
    commentArea.value = q.gabaritoComentado || '';
    commentArea.addEventListener('input', function(){ q.gabaritoComentado = commentArea.value; });
    wrap.appendChild(commentArea);

    var doneRow = el('div', { class: 'edit-done-row' });
    var doneBtn = el('button', {
      class: 'btn-ghost',
      onclick: function(){
        state.reviewEditIndex = null;
        render();
        persistDeckQuestions().catch(function(e){ console.error(e); });
      }
    }, ['Concluído']);
    doneRow.appendChild(doneBtn);
    wrap.appendChild(doneRow);

    return wrap;
  }

  function truncate(str, n){
    return str.length > n ? str.slice(0, n).trim() + '…' : str;
  }

  // Renderiza um texto como parágrafos de verdade (um <p> por trecho
  // separado por linha em branco no texto original), em vez de um bloco
  // único e denso. Essencial para enunciados longos (textos de apoio,
  // artigos) onde a legibilidade importa muito mais do que numa alternativa
  // curta. Se não há quebra nenhuma, cai num único parágrafo normalmente.
  function paragraphsEl(text, className){
    var wrap = document.createElement('div');
    if(className) wrap.className = className;
    var parts = (text || '').split(/\n{2,}/).map(function(p){ return p.trim(); }).filter(Boolean);
    if(parts.length === 0){
      wrap.textContent = text || '';
      return wrap;
    }
    parts.forEach(function(p){
      var pEl = document.createElement('p');
      pEl.textContent = p;
      wrap.appendChild(pEl);
    });
    return wrap;
  }

  /* ============ QUIZ VIEW ============ */
  function renderQuiz(){
    var progressRow = el('div', { class: 'progress-row' });
    state.questions.forEach(function(q, i){
      var st = state.answers[i];
      var cls = 'prog-dot';
      if(i === state.currentIndex) cls += ' current';
      if(state.submitted){
        if(st && st.skipped) cls += ' skip';
        else if(st && q.gabarito) cls += (st.letter === q.gabarito ? ' correct' : ' wrong');
      } else if(st){
        cls += (st.skipped ? ' skip' : ' answered-flag');
      }
      var dot = el('button', { class: cls, 'aria-label': 'Ir para questão ' + q.number }, [String(q.number)]);
      dot.addEventListener('click', function(){ state.currentIndex = i; render(); });
      progressRow.appendChild(dot);
    });
    app.appendChild(progressRow);

    var q = state.questions[state.currentIndex];
    var answered = state.answers[state.currentIndex];

    var meta = el('div', { class: 'q-meta' }, [
      el('span', { class: 'q-count' }, ['Questão ' + (state.currentIndex + 1) + ' de ' + state.questions.length])
    ]);
    app.appendChild(meta);
    app.appendChild(paragraphsEl(q.text, 'q-text'));

    var altList = el('div', { class: 'alt-list' });
    q.alternatives.forEach(function(a){
      var classes = 'alt';
      var selectedLetter = answered ? answered.letter : null;

      if(state.submitted){
        classes += ' locked';
        if(selectedLetter === a.letter) classes += ' selected';
        if(q.gabarito){
          if(a.letter === q.gabarito) classes += ' is-correct';
          else if(a.letter === selectedLetter && selectedLetter !== q.gabarito) classes += ' is-wrong';
        }
      } else {
        if(selectedLetter === a.letter) classes += ' selected';
      }

      var btn = el('button', { class: classes, disabled: state.submitted }, [
        el('span', { class: 'bubble' }, [a.letter]),
        el('span', {}, [a.text])
      ]);
      if(!state.submitted){
        btn.addEventListener('click', function(){ selectAnswer(a.letter); });
      }
      altList.appendChild(btn);
    });
    app.appendChild(altList);

    if(state.submitted){
      var fb;
      if(!q.gabarito){
        fb = el('div', { class: 'feedback none' }, ['Gabarito não informado para esta questão — resposta registrada como "sem gabarito".']);
      } else if(answered && !answered.skipped && answered.letter === q.gabarito){
        fb = el('div', { class: 'feedback ok' }, ['Certa! A resposta é a letra ' + q.gabarito + '.']);
      } else if(answered && !answered.skipped){
        fb = el('div', { class: 'feedback bad' }, ['Errada. Você marcou ' + answered.letter + ' — a resposta certa é a letra ' + q.gabarito + '.']);
      } else {
        fb = el('div', { class: 'feedback bad' }, ['Não respondida — a resposta certa é a letra ' + q.gabarito + '.']);
      }
      app.appendChild(fb);
      if(q.gabaritoComentado){
        var cbox2 = el('div', { class: 'comment-box' }, [
          el('div', { class: 'comment-label' }, ['Gabarito comentado'])
        ]);
        cbox2.appendChild(paragraphsEl(q.gabaritoComentado));
        app.appendChild(cbox2);
      }
      app.appendChild(renderCommentsToggle(q));
    }

    var actions = el('div', { class: 'quiz-actions' });

    if(state.submitted){
      var backBtn = el('button', { class: 'btn-ghost' }, ['← Voltar ao resultado']);
      backBtn.addEventListener('click', function(){ state.view = 'result'; render(); });
      actions.appendChild(backBtn);
      var navWrap = el('div', { class: 'row', style: 'margin:0;' });
      var prevBtn2 = el('button', { class: 'btn-ghost' }, ['← Anterior']);
      prevBtn2.disabled = state.currentIndex === 0;
      prevBtn2.addEventListener('click', function(){ if(state.currentIndex > 0){ state.currentIndex--; render(); } });
      var nextBtn2 = el('button', { class: 'btn-ghost' }, ['Próxima →']);
      nextBtn2.disabled = state.currentIndex === state.questions.length - 1;
      nextBtn2.addEventListener('click', function(){ if(state.currentIndex < state.questions.length - 1){ state.currentIndex++; render(); } });
      navWrap.appendChild(prevBtn2); navWrap.appendChild(nextBtn2);
      actions.appendChild(navWrap);
      app.appendChild(actions);
      return;
    }

    var leftBtns = el('div', { class: 'row', style: 'margin:0;' });

    var skipBtn = el('button', { class: 'btn-ghost' }, ['Pular']);
    skipBtn.addEventListener('click', function(){
      state.answers[state.currentIndex] = { letter: null, skipped: true };
      if(state.currentIndex < state.questions.length - 1){ state.currentIndex++; }
      render();
    });
    leftBtns.appendChild(skipBtn);

    var prevBtn = el('button', { class: 'btn-ghost' }, ['← Anterior']);
    prevBtn.disabled = state.currentIndex === 0;
    prevBtn.addEventListener('click', function(){
      if(state.currentIndex > 0){ state.currentIndex--; render(); }
    });
    leftBtns.appendChild(prevBtn);
    actions.appendChild(leftBtns);

    var isLast = state.currentIndex === state.questions.length - 1;
    var nextBtn = el('button', { class: 'btn-primary' }, [isLast ? 'Enviar respostas' : 'Próxima →']);
    nextBtn.disabled = !answered;
    nextBtn.addEventListener('click', function(){
      if(isLast){ submitQuiz(); }
      else { state.currentIndex++; render(); }
    });
    actions.appendChild(nextBtn);

    app.appendChild(actions);
  }

  function selectAnswer(letter){
    state.answers[state.currentIndex] = { letter: letter, skipped: false };
    render();
  }

  function submitQuiz(){
    state.submitted = true;
    state.view = 'result';
    state.currentIndex = 0;
    if(state.dailyRun){
      saveDailyResult().catch(function(e){ console.error(e); });
    }
    render();
  }

  document.addEventListener('keydown', function(e){
    if(state.view !== 'quiz' || state.submitted) return;
    var key = e.key.toUpperCase();
    var q = state.questions[state.currentIndex];
    if(['A','B','C','D','E'].indexOf(key) !== -1){
      var exists = q.alternatives.some(function(a){ return a.letter === key; });
      if(exists) selectAnswer(key);
    } else if(e.key === 'Enter'){
      var isLast = state.currentIndex === state.questions.length - 1;
      if(isLast){ submitQuiz(); }
      else if(state.answers[state.currentIndex]){ state.currentIndex++; render(); }
    }
  });

  /* ============ RESULT VIEW ============ */
  function renderResult(){
    var total = state.questions.length;
    var correct = 0, wrong = 0, skipped = 0, noGab = 0;
    state.questions.forEach(function(q, i){
      var a = state.answers[i];
      if(!a || a.skipped){ skipped++; return; }
      if(!q.gabarito){ noGab++; return; }
      if(a.letter === q.gabarito) correct++; else wrong++;
    });
    var scored = correct + wrong;
    var pct = scored ? Math.round((correct / scored) * 100) : 0;

    var hero = el('div', { class: 'score-hero' }, [
      el('div', { class: 'score-ring', style: '--pct:' + pct + ';' }, [
        el('div', { class: 'score-ring-num' }, [correct + '/' + scored])
      ]),
      el('div', { class: 'score-sub' }, [
        pct + '% de acerto' +
        (skipped ? ' · ' + skipped + ' puladas' : '') +
        (noGab ? ' · ' + noGab + ' sem gabarito' : '')
      ])
    ]);
    app.appendChild(hero);

    state.questions.forEach(function(q, i){
      var a = state.answers[i];
      var tag, tagClass;
      if(!a || a.skipped){ tag = 'pulada'; tagClass = 'skip'; }
      else if(!q.gabarito){ tag = 'sem gabarito'; tagClass = 'skip'; }
      else if(a.letter === q.gabarito){ tag = 'certa'; tagClass = 'correct'; }
      else { tag = 'errada (' + a.letter + ' → ' + q.gabarito + ')'; tagClass = 'wrong'; }

      var row = el('div', { class: 'result-item' }, [
        el('span', { class: 'rtext' }, [q.number + '. ' + truncate(q.text, 70)]),
        el('span', { class: 'result-tag ' + tagClass }, [tag])
      ]);
      row.style.cursor = 'pointer';
      row.addEventListener('click', function(){
        state.view = 'quiz';
        state.currentIndex = i;
        render();
      });
      app.appendChild(row);
    });

    var retryBtn = el('button', { class: 'btn-primary' }, ['Refazer este simulado']);
    retryBtn.addEventListener('click', function(){
      state.answers = {};
      state.currentIndex = 0;
      state.submitted = false;
      state.view = 'quiz';
      render();
    });
    var newBtn = el('button', { class: 'btn-ghost' }, ['Novo simulado']);
    newBtn.addEventListener('click', goHome);

    app.appendChild(el('div', { class: 'row' }, [retryBtn, newBtn]));
  }

  updateAuthUI();
  initGoogleAuth();
  tryRestoreSession();
  render();
})();
</script>
